name: chambi_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.2.0

  # Google Sign-In (mock for now, wire to Firebase later)
  google_sign_in: ^6.2.1

  # Image picking (for tasker registration - portfolio, profile photo)
  image_picker: ^1.0.7

  # Location
  geolocator: ^12.0.0

  # Address autocomplete
  mapbox_search: ^4.4.0

  # Bottom navigation
  salomon_bottom_bar: ^3.3.2

  # Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
    - family: AppleColorEmoji
      fonts:
        - asset: assets/fonts/AppleColorEmoji.ttf

  assets:
    - assets/icons/logo.svg
    - assets/images/onboard-tasker-1.png
    - assets/images/onboard-tasker-2.png
    - assets/images/onboard-tasker-3.png
    - assets/images/onboard-contratist-1.png
    - assets/images/onboard-contratist-2.png
    - assets/images/onboard-contratist-3.png